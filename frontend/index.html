<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HealthPulse — AI-Powered Health Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #050a12;
  --surface: #0d1526;
  --surface2: #111d35;
  --surface3: #162040;
  --border: rgba(99,179,255,0.12);
  --border2: rgba(99,179,255,0.22);
  --accent: #3b9eff;
  --accent2: #00e5c8;
  --accent3: #ff6b9d;
  --warn: #ffb84d;
  --danger: #ff4f6a;
  --success: #00d68f;
  --text: #e8f0ff;
  --text2: #7a9cc7;
  --text3: #4a6490;
  --low: #00d68f;
  --moderate: #ffb84d;
  --high: #ff6b2b;
  --critical: #ff2d55;
  --font-display: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 8px 40px rgba(0,0,0,0.4);
  --glow: 0 0 30px rgba(59,158,255,0.15);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
/* === SCROLLBAR === */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }

/* === LAYOUT === */
#app { display: flex; min-height: 100vh; }
.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0;
  height: 100vh;
  z-index: 100;
  transition: transform 0.3s ease;
}
.main-content {
  flex: 1;
  margin-left: 260px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
/* === LOGO === */
.logo {
  padding: 28px 24px 20px;
  border-bottom: 1px solid var(--border);
}
.logo-mark {
  display: flex; align-items: center; gap: 12px;
}
.logo-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: 0 4px 20px rgba(59,158,255,0.3);
}
.logo-text h1 {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #fff, var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.logo-text p {
  font-size: 10px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-top: 1px;
}
/* === NAV === */
.nav-section { padding: 12px 16px 4px; }
.nav-label {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text3);
  padding: 0 8px;
  margin-bottom: 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  color: var(--text2);
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
  margin-bottom: 2px;
  position: relative;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active {
  background: linear-gradient(135deg, rgba(59,158,255,0.15), rgba(0,229,200,0.08));
  color: var(--accent);
  border: 1px solid rgba(59,158,255,0.2);
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 20px;
  background: var(--accent);
  border-radius: 0 3px 3px 0;
}
.nav-icon { font-size: 18px; width: 24px; text-align: center; }
.nav-badge {
  margin-left: auto;
  background: var(--accent);
  color: white;
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 20px;
  font-weight: 600;
}
/* === USER CARD === */
.user-card {
  margin-top: auto;
  padding: 16px;
  border-top: 1px solid var(--border);
}
.user-info {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  background: var(--surface2);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}
.user-avatar {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.user-details h4 { font-size: 13px; font-weight: 600; }
.user-details p { font-size: 11px; color: var(--text3); }
.logout-btn {
  margin-top: 8px;
  width: 100%;
  padding: 8px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text2);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-body);
}
.logout-btn:hover { background: rgba(255,79,106,0.1); border-color: var(--danger); color: var(--danger); }
/* === TOPBAR === */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 64px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.topbar-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
}
.topbar-subtitle { font-size: 12px; color: var(--text3); margin-top: 2px; }
.topbar-actions { display: flex; align-items: center; gap: 12px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  font-family: var(--font-body);
  text-decoration: none;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), #2980d9);
  color: white;
  box-shadow: 0 4px 15px rgba(59,158,255,0.25);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,158,255,0.35); }
.btn-secondary {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--surface3); }
.btn-danger {
  background: rgba(255,79,106,0.15);
  color: var(--danger);
  border: 1px solid rgba(255,79,106,0.3);
}
.btn-danger:hover { background: rgba(255,79,106,0.25); }
.btn-success {
  background: rgba(0,214,143,0.15);
  color: var(--success);
  border: 1px solid rgba(0,214,143,0.3);
}
.btn-success:hover { background: rgba(0,214,143,0.25); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
/* === PAGE CONTENT === */
.page { padding: 32px; flex: 1; }
.page-hidden { display: none; }
/* === CARDS === */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.card-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
}
.card-subtitle { font-size: 12px; color: var(--text3); margin-top: 2px; }
/* === STAT CARDS === */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
}
.stat-card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: var(--glow); }
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 100px; height: 100px;
  border-radius: 50%;
  opacity: 0.06;
  transform: translate(30%, -30%);
}
.stat-card.blue::before { background: var(--accent); }
.stat-card.green::before { background: var(--success); }
.stat-card.orange::before { background: var(--warn); }
.stat-card.pink::before { background: var(--accent3); }
.stat-icon {
  font-size: 28px;
  margin-bottom: 12px;
}
.stat-value {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 4px;
}
.stat-label { font-size: 13px; color: var(--text2); }
.stat-change {
  font-size: 11px;
  margin-top: 8px;
  padding: 3px 8px;
  border-radius: 20px;
  display: inline-block;
}
.stat-change.up { background: rgba(0,214,143,0.15); color: var(--success); }
.stat-change.down { background: rgba(255,79,106,0.15); color: var(--danger); }
/* === CHARTS GRID === */
.charts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}
.charts-grid-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}
.chart-container { position: relative; height: 220px; }
/* === RISK BADGE === */
.risk-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.risk-Low { background: rgba(0,214,143,0.15); color: var(--low); border: 1px solid rgba(0,214,143,0.3); }
.risk-Moderate { background: rgba(255,184,77,0.15); color: var(--moderate); border: 1px solid rgba(255,184,77,0.3); }
.risk-High { background: rgba(255,107,43,0.15); color: var(--high); border: 1px solid rgba(255,107,43,0.3); }
.risk-Critical { background: rgba(255,45,85,0.15); color: var(--critical); border: 1px solid rgba(255,45,85,0.3); }
/* === TABLE === */
.table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; }
thead { background: var(--surface2); }
th {
  padding: 14px 16px;
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text3);
  white-space: nowrap;
  cursor: pointer;
}
th:hover { color: var(--text); }
td {
  padding: 14px 16px;
  font-size: 13px;
  border-top: 1px solid var(--border);
  vertical-align: middle;
}
tr:hover td { background: rgba(59,158,255,0.03); }
.patient-name { font-weight: 600; font-size: 14px; }
.patient-email { font-size: 11px; color: var(--text3); }
.risk-score-bar {
  display: flex; align-items: center; gap: 8px;
}
.bar-track {
  flex: 1; height: 6px;
  background: var(--surface2);
  border-radius: 3px;
  overflow: hidden;
  min-width: 60px;
}
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.bar-fill.low { background: var(--low); }
.bar-fill.moderate { background: var(--moderate); }
.bar-fill.high { background: var(--high); }
.bar-fill.critical { background: var(--critical); }
.action-btns { display: flex; gap: 6px; }
/* === SEARCH & FILTERS === */
.toolbar {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.search-box {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 14px;
  flex: 1; min-width: 200px;
}
.search-box input {
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 14px;
  font-family: var(--font-body);
  width: 100%;
}
.search-box input::placeholder { color: var(--text3); }
.filter-select {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 14px;
  color: var(--text);
  font-size: 13px;
  font-family: var(--font-body);
  outline: none;
  cursor: pointer;
}
/* === MODAL === */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 20px;
  width: 100%; max-width: 620px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 40px 80px rgba(0,0,0,0.5);
}
.modal-header {
  padding: 28px 28px 0;
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
}
.modal-close {
  width: 32px; height: 32px;
  background: var(--surface2);
  border: none;
  border-radius: 8px;
  color: var(--text2);
  cursor: pointer;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--surface3); color: var(--text); }
.modal-body { padding: 24px 28px; }
.modal-footer {
  padding: 0 28px 28px;
  display: flex; gap: 12px; justify-content: flex-end;
}
/* === FORM === */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: 1 / -1; }
.form-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.form-input {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  color: var(--text);
  font-size: 14px;
  font-family: var(--font-body);
  outline: none;
  transition: border-color 0.2s;
}
.form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,158,255,0.1); }
.form-input.error { border-color: var(--danger); }
.form-error { font-size: 11px; color: var(--danger); }
.form-hint { font-size: 11px; color: var(--text3); }
.form-divider {
  grid-column: 1/-1;
  border: none;
  border-top: 1px solid var(--border);
  margin: 4px 0;
}
/* === NORMAL RANGES === */
.normal-ranges {
  background: var(--surface2);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-top: 8px;
  font-size: 12px;
  color: var(--text2);
  line-height: 1.8;
}
.normal-ranges b { color: var(--accent2); }
/* === REMARKS BOX === */
.remarks-box {
  background: linear-gradient(135deg, rgba(59,158,255,0.08), rgba(0,229,200,0.05));
  border: 1px solid rgba(59,158,255,0.2);
  border-radius: var(--radius-sm);
  padding: 14px;
  font-size: 13px;
  line-height: 1.6;
  color: var(--text);
  min-height: 80px;
  font-style: italic;
}
.ai-label {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent2);
  margin-bottom: 8px;
}
.ai-dot {
  width: 6px; height: 6px;
  background: var(--accent2);
  border-radius: 50%;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
/* === PAGINATION === */
.pagination {
  display: flex; align-items: center; gap: 8px;
  justify-content: center;
  margin-top: 20px;
}
.page-btn {
  width: 36px; height: 36px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text2);
  cursor: pointer;
  font-size: 13px;
  font-family: var(--font-body);
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.page-btn:hover { background: var(--surface2); color: var(--text); }
.page-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
/* === AUTH PAGES === */
.auth-page {
  min-height: 100vh;
  width: 100%;
  flex: 1;
  display: flex;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}
.auth-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(59,158,255,0.06) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(0,229,200,0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 60% 80%, rgba(255,107,157,0.04) 0%, transparent 50%);
  z-index: 1;
}
.auth-grid {
  position: absolute; inset: 0;
  background-image: linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 60px 60px;
  opacity: 0.3;
  z-index: 1;
}
.auth-form-side {
  flex: 1;
  max-width: 480px;
  min-width: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px;
  background: var(--surface);
  border-right: 1px solid var(--border2);
  position: relative;
  z-index: 10;
  box-shadow: 10px 0 40px rgba(0,0,0,0.3);
}
@media (max-width: 900px) {
  .auth-form-side {
    max-width: 100%;
    border-right: none;
    box-shadow: none;
  }
}
.auth-card {
  width: 100%;
  max-width: 380px;
  position: relative;
  z-index: 1;
}
.auth-logo { text-align: center; margin-bottom: 36px; }
.auth-logo-icon {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  margin: 0 auto 16px;
  box-shadow: 0 10px 40px rgba(59,158,255,0.3);
}
.auth-logo h1 {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 800;
  background: linear-gradient(135deg, #fff, var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.auth-logo p { font-size: 14px; color: var(--text3); margin-top: 6px; }
.auth-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin-bottom: 8px; text-align: center; }
.auth-subtitle { font-size: 14px; color: var(--text2); margin-bottom: 32px; text-align: center; }
.auth-form { display: flex; flex-direction: column; gap: 16px; }
.auth-btn {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, var(--accent), #2980d9);
  border: none;
  border-radius: var(--radius-sm);
  color: white;
  font-size: 15px;
  font-weight: 700;
  font-family: var(--font-display);
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
  box-shadow: 0 4px 20px rgba(59,158,255,0.3);
}
.auth-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(59,158,255,0.4); }
.auth-switch { text-align: center; font-size: 14px; color: var(--text2); margin-top: 20px; }
.auth-switch a { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 600; }
.auth-switch a:hover { text-decoration: underline; }
.auth-demo {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  margin-top: 16px;
  font-size: 12px;
  color: var(--text2);
  line-height: 1.8;
}
.auth-demo strong { color: var(--accent2); }

/* === AUTH DESIGN SIDE === */
.auth-design-side {
  flex: 1.4;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: radial-gradient(circle at 40% 40%, rgba(59, 158, 255, 0.08) 0%, transparent 60%);
  padding: 60px;
  overflow: hidden;
}
@media (max-width: 900px) {
  .auth-design-side {
    display: none;
  }
}
.auth-design-content {
  max-width: 540px;
  width: 100%;
  position: relative;
  z-index: 5;
}
.promo-badge {
  display: inline-block;
  padding: 6px 12px;
  background: rgba(59, 158, 255, 0.1);
  border: 1px solid rgba(59, 158, 255, 0.2);
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  border-radius: 20px;

<body>

<div id="toast-container" class="toast-container"></div>
<div id="app"></div>

<script>
// ============================================================
// STATE MANAGEMENT
// ============================================================
const API = 'https://healthpulse-ai-alvv.onrender.com/api';
let state = {
  page: 'login',
  user: null,
  patients: [],
  dashStats: null,
  loading: false,
  totalPatients: 0,
  totalPages: 1,
  currentPage: 1,
  search: '',
  riskFilter: '',
  sortBy: 'created_at',
  sortDir: 'desc',
  editPatient: null,
  viewPatient: null,
  showAddModal: false,
  showEditModal: false,
  showViewModal: false,
  showDeleteModal: false,
  deleteId: null,
  charts: {},
  alerts: [
    { id:1, type:'critical', title:'Frank Wilson has Critical risk score (70/100)', time:'2 hours ago', patient:'Frank Wilson' },
    { id:2, type:'high', title:'David Brown requires urgent physician review', time:'3 hours ago', patient:'David Brown' },
    { id:3, type:'moderate', title:'Henry Taylor – cholesterol borderline high (225 mg/dL)', time:'5 hours ago', patient:'Henry Taylor' },
    { id:4, type:'info', title:'10 patients seeded to database on startup', time:'Today', patient:null },
    { id:5, type:'success', title:'Alice Johnson – all values within normal range', time:'Yesterday', patient:'Alice Johnson' },
  ]
};

// ============================================================
// API HELPERS
// ============================================================
async function api(method, path, body) {
  try {
    const opts = {
      method,
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include'
    };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(API + path, opts);
    const data = await res.json();
    if (!res.ok) throw data;
    return data;
  } catch(e) {
    throw e;
  }
}

// ============================================================
// TOAST
// ============================================================
function toast(msg, type='info') {
  const icons = { success:'✅', error:'❌', info:'ℹ️' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

// ============================================================
// ROUTER / RENDER
// ============================================================
function navigate(page) {
  state.page = page;
  render();
}

function render() {
  const app = document.getElementById('app');
  const isAuth = state.user !== null;
  const authPages = ['login','signup'];

  if (!isAuth && !authPages.includes(state.page)) {
    state.page = 'login';
  }
  if (isAuth && authPages.includes(state.page)) {
    state.page = 'dashboard';
  }

  if (!isAuth) {
    app.innerHTML = state.page === 'login' ? renderLogin() : renderSignup();
    attachAuthEvents();
    return;
  }

  app.innerHTML = `
    ${renderSidebar()}
    <div class="main-content">
      ${renderTopbar()}
      <div id="page-content">
        ${renderPage()}
      </div>
    </div>
    ${renderModals()}
  `;
  attachEvents();
  renderCharts();
}

// AUTH PAGES

    </div>
  </div>`;

function attachAuthEvents() {}

async function doLogin() {
  const email = document.getElementById('login-email').value;
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  try {
    const data = await api('POST', '/auth/login', { email, password: pass });
    state.user = data.user;
    toast('Welcome back, ' + data.user.name, 'success');
    navigate('dashboard');
    loadDashboard();
  } catch(e) {
    errEl.textContent = e.error || 'Login failed';
    errEl.style.display = 'block';
  }
}

async function doRegister() {
  const name = document.getElementById('reg-name').value;
  const email = document.getElementById('reg-email').value;
  const pass = document.getElementById('reg-pass').value;
  const errEl = document.getElementById('reg-error');
  errEl.style.display = 'none';
  try {
    const data = await api('POST', '/auth/register', { name, email, password: pass });
    state.user = data.user;
    toast('Account created! Welcome to HealthPulse', 'success');
    navigate('dashboard');
    loadDashboard();
  } catch(e) {
    errEl.textContent = e.error || 'Registration failed';
    errEl.style.display = 'block';
  }
}

async function doLogout() {
  await api('POST', '/auth/logout');
  state.user = null;
  toast('Signed out successfully', 'info');
  navigate('login');
}

const pageInfo = {

  analytics: { title: 'Analytics', subtitle: 'In-depth health metrics & trends' },
  alerts: { title: 'Health Alerts', subtitle: 'Critical patient notifications' },
  reports: { title: 'Reports', subtitle: 'Generate and export health reports' },
  about: { title: 'About HealthPulse', subtitle: 'Platform overview and features' },
  settings: { title: 'Settings', subtitle: 'Configure your preferences' },
};

function renderTopbar() {
  const info = pageInfo[state.page] || {};
  return `
  <header class="topbar">
    <div>
      <div class="topbar-title">${info.title || ''}</div>
      <div class="topbar-subtitle">${info.subtitle || ''}</div>
    </div>
    <div class="topbar-actions">

    </div>
  </header>`;
}

function refreshPage() {
  if (state.page === 'dashboard') loadDashboard();
  if (state.page === 'patients') loadPatients();
  if (state.page === 'analytics') loadDashboard();
  toast('Refreshed', 'info');
}

// ============================================================
// PAGE ROUTING
// ============================================================
function renderPage() {
  switch(state.page) {
    case 'dashboard': return renderDashboard();
    case 'patients': return renderPatients();
    case 'analytics': return renderAnalytics();
    case 'alerts': return renderAlerts();
    case 'reports': return renderReports();
    case 'about': return renderAbout();
    case 'settings': return renderSettings();
    default: return renderDashboard();
  }
}

          <canvas id="chart-chol"></canvas>

    </div>

function renderPatients() {
  return `
  <div class="page">
    <div class="toolbar">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" placeholder="Search by name or email..." id="search-input" value="${state.search}" oninput="debounceSearch(this.value)">
      </div>
      <select class="filter-select" id="risk-filter" onchange="filterByRisk(this.value)">
        <option value="">All Risk Levels</option>
        <option value="Low" ${state.riskFilter==='Low'?'selected':''}>🟢 Low</option>
        <option value="Moderate" ${state.riskFilter==='Moderate'?'selected':''}>🟡 Moderate</option>
        <option value="High" ${state.riskFilter==='High'?'selected':''}>🟠 High</option>
        <option value="Critical" ${state.riskFilter==='Critical'?'selected':''}>🔴 Critical</option>
      </select>
      <button class="btn btn-secondary btn-sm" onclick="exportCSV()">⬇ Export CSV</button>
    </div>

    ${state.loading ? `<div class="loader"><div class="spinner"></div> Loading patients...</div>` : ''}

    ${!state.loading && state.patients.length === 0 ? `
      <div class="empty">
        <div class="empty-icon">🏥</div>
        <h3>No patients found</h3>
        <p>Try adjusting your search or add a new patient</p>
        <br><button class="btn btn-primary" onclick="openAddModal()">+ Add First Patient</button>
      </div>
    ` : ''}

    ${!state.loading && state.patients.length > 0 ? `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th onclick="sortBy('full_name')">Name ${state.sortBy==='full_name'?(state.sortDir==='asc'?'↑':'↓'):''}</th>
              <th onclick="sortBy('date_of_birth')">Age</th>
              <th>Glucose <small style="color:var(--text3)">(mg/dL)</small></th>
              <th>Hgb <small style="color:var(--text3)">(g/dL)</small></th>
              <th>Chol <small style="color:var(--text3)">(mg/dL)</small></th>
              <th onclick="sortBy('risk_score')">Risk Score</th>
              <th>Risk Level</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${state.patients.map(p => {
              const scoreClass = p.risk_level==='Low'?'low':p.risk_level==='Moderate'?'moderate':p.risk_level==='High'?'high':'critical';
              return `
              <tr>
                <td>
                  <div class="patient-name" style="cursor:pointer;color:var(--accent)" onclick="viewPatient(${p.id})">${p.full_name}</div>
                  <div class="patient-email">${p.email}</div>
                </td>
                <td>${p.age} yrs</td>
                <td><span class="tag" style="color:${p.glucose>125?'var(--danger)':p.glucose>99?'var(--warn)':'var(--success)'}">${p.glucose}</span></td>
                <td><span class="tag" style="color:${p.haemoglobin<12?'var(--danger)':p.haemoglobin<13?'var(--warn)':'var(--success)'}">${p.haemoglobin}</span></td>
                <td><span class="tag" style="color:${p.cholesterol>239?'var(--danger)':p.cholesterol>199?'var(--warn)':'var(--success)'}">${p.cholesterol}</span></td>
                <td>
                  <div class="risk-score-bar">
                    <div class="bar-track">
                      <div class="bar-fill ${scoreClass}" style="width:${p.risk_score}%"></div>
                    </div>
                    <span style="font-family:var(--font-mono);font-size:12px;color:var(--text2)">${Math.round(p.risk_score)}</span>
                  </div>
                </td>
                <td><span class="risk-badge risk-${p.risk_level}">● ${p.risk_level}</span></td>
                <td>
                  <div class="action-btns">
                    <button class="btn btn-secondary btn-sm" onclick="viewPatient(${p.id})" title="View">👁</button>
                    <button class="btn btn-secondary btn-sm" onclick="openEditModal(${p.id})" title="Edit">✏️</button>
                    <button class="btn btn-danger btn-sm" onclick="confirmDelete(${p.id})" title="Delete">🗑</button>
                  </div>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <button class="page-btn" onclick="goPage(${state.currentPage-1})" ${state.currentPage<=1?'disabled':''}>←</button>
        ${Array.from({length:state.totalPages},(_,i)=>i+1).map(n=>`
          <button class="page-btn ${n===state.currentPage?'active':''}" onclick="goPage(${n})">${n}</button>
        `).join('')}
        <button class="page-btn" onclick="goPage(${state.currentPage+1})" ${state.currentPage>=state.totalPages?'disabled':''}>→</button>
        <span style="font-size:13px;color:var(--text3);margin-left:8px">${state.totalPatients} total</span>
      </div>
    ` : ''}
  </div>`;
}

// ============================================================
// PATIENT ACTIONS
// ============================================================
function openAddModal() {
  state.showAddModal = true;
  state.showEditModal = false;
  state.editPatient = null;
  render();
}

async function openEditModal(id) {
  try {
    const data = await api('GET', `/patients/${id}`);
    state.editPatient = data.patient;
    state.showEditModal = true;
    state.showAddModal = false;
    state.showViewModal = false;
    render();
  } catch(e) { toast('Failed to load patient', 'error'); }
}

async function viewPatient(id) {
  try {
    const data = await api('GET', `/patients/${id}`);
    state.viewPatient = data.patient;
    state.showViewModal = true;
    state.showAddModal = false;
    state.showEditModal = false;
    render();
  } catch(e) { toast('Failed to load patient', 'error'); }
}

function confirmDelete(id) {
  state.deleteId = id;
  state.showDeleteModal = true;
  render();
}

function closeModals() {
  state.showAddModal = false;
  state.showEditModal = false;
  state.showViewModal = false;
  state.showDeleteModal = false;
  state.editPatient = null;
  state.viewPatient = null;
  state.deleteId = null;
  render();
}

function getFormData() {
  return {
    full_name: document.getElementById('f-name')?.value || '',
    date_of_birth: document.getElementById('f-dob')?.value || '',
    email: document.getElementById('f-email')?.value || '',
    glucose: document.getElementById('f-glucose')?.value || '',
    haemoglobin: document.getElementById('f-hgb')?.value || '',
    cholesterol: document.getElementById('f-chol')?.value || '',
  };
}

function showFormErrors(errors) {
  Object.entries(errors).forEach(([field, msg]) => {
    const el = document.getElementById(`err-${field}`);
    if (el) el.textContent = msg;
    const inp = document.getElementById(`f-${field.replace('full_name','name').replace('date_of_birth','dob').replace('haemoglobin','hgb').replace('cholesterol','chol')}`);
    if (inp) inp.classList.add('error');
  });
}

async function savePatient() {
  const btn = document.getElementById('save-btn');
  if (btn) { btn.textContent = '⏳ Analyzing...'; btn.disabled = true; }

  // Clear errors
  ['full_name','date_of_birth','email','glucose','haemoglobin','cholesterol'].forEach(f => {
    const el = document.getElementById(`err-${f}`);
    if (el) el.textContent = '';
  });

  try {
    const data = await api('POST', '/patients/', getFormData());
    toast('Patient added and analyzed successfully!', 'success');
    closeModals();
    loadPatients();
    loadDashboard();
  } catch(e) {
    if (e.errors) showFormErrors(e.errors);
    else toast(e.error || 'Failed to save patient', 'error');
    if (btn) { btn.textContent = '🤖 Save & Analyze'; btn.disabled = false; }
  }
}

async function updatePatient(id) {
  const btn = document.getElementById('save-btn');
  if (btn) { btn.textContent = '⏳ Updating...'; btn.disabled = true; }
  try {
    const data = await api('PUT', `/patients/${id}`, getFormData());
    toast('Patient updated successfully!', 'success');
    closeModals();
    loadPatients();
    loadDashboard();
  } catch(e) {
    if (e.errors) showFormErrors(e.errors);
    else toast(e.error || 'Failed to update patient', 'error');
    if (btn) { btn.textContent = '💾 Update & Re-analyze'; btn.disabled = false; }
  }
}

async function deletePatient(id) {
  try {
    await api('DELETE', `/patients/${id}`);
    toast('Patient deleted', 'success');
    closeModals();
    loadPatients();
    loadDashboard();
  } catch(e) { toast('Failed to delete patient', 'error'); }
}

async function reanalyze(id) {
  toast('Running AI analysis...', 'info');
  try {
    const data = await api('POST', `/patients/${id}/reanalyze`);
    state.viewPatient = data.patient;
    toast('Analysis updated!', 'success');
    render();
  } catch(e) { toast('Analysis failed', 'error'); }
}

// ============================================================
// LOAD DATA
// ============================================================
async function loadPatients() {
  state.loading = true;
  if (state.page === 'patients') {
    document.getElementById('page-content').innerHTML = renderPage();
  }
  try {
    const params = new URLSearchParams({
      page: state.currentPage,
      per_page: 10,
      search: state.search,
      risk: state.riskFilter,
      sort: state.sortBy,
      dir: state.sortDir,
    });
    const data = await api('GET', `/patients/?${params}`);
    state.patients = data.patients;
    state.totalPatients = data.total;
    state.totalPages = data.pages;
  } catch(e) { toast('Failed to load patients', 'error'); }
  state.loading = false;
  if (state.page === 'patients') {
    document.getElementById('page-content').innerHTML = renderPage();
    attachEvents();
  }
}

async function loadDashboard() {
  try {
    const data = await api('GET', '/dashboard/stats');
    state.dashStats = data;
    if (state.page === 'dashboard' || state.page === 'analytics') {
      document.getElementById('page-content').innerHTML = renderPage();
      attachEvents();
      renderCharts();
    }
  } catch(e) { console.error('Dashboard load error:', e); }
}

// ============================================================
// SORTING, FILTERING, PAGINATION
// ============================================================
let searchTimeout;
function debounceSearch(val) {
  state.search = val;
  state.currentPage = 1;
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(loadPatients, 400);
}

function filterByRisk(val) {
  state.riskFilter = val;
  state.currentPage = 1;
  loadPatients();
}

function sortBy(col) {
  if (state.sortBy === col) {
    state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    state.sortBy = col;
    state.sortDir = 'asc';
  }
  loadPatients();
}

function goPage(n) {
  if (n < 1 || n > state.totalPages) return;
  state.currentPage = n;
  loadPatients();
}

Chart.defaults.color = '#7a9cc7';
Chart.defaults.borderColor = 'rgba(99,179,255,0.1)';
Chart.defaults.font.family = "'DM Sans', sans-serif";

function destroyChart(id) {
  const existing = Chart.getChart(id);
  if (existing) existing.destroy();
}

// ============================================================
// EXPORT CSV
// ============================================================
async function exportCSV() {
  try {
    const data = await api('GET', '/patients/?page=1&per_page=1000');
    const rows = [
      ['ID','Name','DOB','Email','Glucose','Haemoglobin','Cholesterol','Risk Level','Risk Score','Remarks'],
      ...data.patients.map(p => [p.id, p.full_name, p.date_of_birth, p.email, p.glucose, p.haemoglobin, p.cholesterol, p.risk_level, p.risk_score, `"${(p.remarks||'').replace(/"/g,'""')}"`])
    ];
    const csv = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'healthpulse_patients.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('CSV exported successfully!', 'success');
  } catch(e) { toast('Export failed', 'error'); }
}

}

// ============================================================
// INIT
// ============================================================
async function init() {
  try {
    const data = await api('GET', '/auth/me');
    state.user = data.user;
    state.page = 'dashboard';
    render();
    loadDashboard();
    loadPatients();
  } catch(e) {
    state.page = 'login';
    render();
  }
}

init();
</script>
